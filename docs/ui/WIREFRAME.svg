<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1710" viewBox="0 0 1600 1710" role="img" aria-labelledby="title desc">
  <title id="title">Here to Slay web wireframe — desktop and mobile</title>
  <desc id="desc">Review wireframe with a tabletop desktop game, a full-screen reaction overlay, lobby and reconnect states, and a mobile layout. All cards are placeholders.</desc>
  <style>
    .page{fill:#f5f1e9}.frame{fill:#fbfaf7;stroke:#27323b;stroke-width:3}.table{fill:#e7f0ec;stroke:#27323b;stroke-width:3}.panel{fill:#fff;stroke:#27323b;stroke-width:2}.muted{fill:#e5e8e9;stroke:#6c7880;stroke-width:2}.card{fill:#fffdf6;stroke:#3e4c54;stroke-width:2}.monster{fill:#fde6d5;stroke:#8e4d3b;stroke-width:2}.hand{fill:#e5ecff;stroke:#415d9d;stroke-width:2}.dark{fill:#27323b}.accent{fill:#e96943}.good{fill:#4b9c73}.warn{fill:#e2a542}.ink{fill:#1d2930}.sub{fill:#53636b}.white{fill:#fff}.h1{font:700 25px Arial,sans-serif;fill:#1d2930}.h2{font:700 18px Arial,sans-serif;fill:#1d2930}.h3{font:700 14px Arial,sans-serif;fill:#1d2930}.tx{font:13px Arial,sans-serif;fill:#1d2930}.sm{font:11px Arial,sans-serif;fill:#53636b}.tiny{font:10px Arial,sans-serif;fill:#53636b}.wtx{font:700 12px Arial,sans-serif;fill:#fff}.center{text-anchor:middle}.dash{stroke:#73838a;stroke-width:2;stroke-dasharray:6 5;fill:none}
  </style>
  <rect class="page" width="1600" height="1710"/>
  <text x="60" y="48" class="h1">UI-001 · ONE PROPOSED DIRECTION · review wireframe</text>
  <text x="60" y="73" class="tx">Neutral placeholder cards only — no third-party artwork or card effect text. Product player count: 2–8; exact seat layout follows.</text>

  <!-- desktop -->
  <text x="60" y="116" class="h2">DESKTOP · tabletop overview</text>
  <rect x="60" y="135" width="1040" height="650" rx="20" class="frame"/>
  <rect x="80" y="184" width="755" height="450" rx="22" class="table"/>
  <rect x="80" y="154" width="1000" height="30" class="dark"/><text x="100" y="174" class="wtx">ROOM 8K4P · TURN 04 · CONNECTED</text><text x="800" y="174" class="wtx">YOUR TURN · 2 / 3 AP</text>
  <!-- opponents -->
  <g><circle cx="220" cy="252" r="35" class="muted"/><text x="220" y="257" class="h3 center">A</text><rect x="265" y="230" width="135" height="47" rx="7" class="panel"/><text x="278" y="250" class="h3">Opponent A</text><text x="278" y="267" class="sm">3 cards · waiting</text></g>
  <g><circle cx="695" cy="245" r="35" class="muted"/><text x="695" y="250" class="h3 center">B</text><rect x="545" y="225" width="137" height="47" rx="7" class="panel"/><text x="558" y="245" class="h3">Opponent B</text><text x="558" y="262" class="sm">turn order · 2nd</text></g>
  <g><circle cx="770" cy="505" r="35" class="muted"/><text x="770" y="510" class="h3 center">C</text><rect x="600" y="520" width="145" height="47" rx="7" class="panel"/><text x="613" y="540" class="h3">Opponent C</text><text x="613" y="557" class="sm">4 cards · waiting</text></g>
  <text x="459" y="315" class="sm center">OPPONENT SEATS · 2–8 PLAYERS · SCROLL / STACK EXTRA SEATS AS NEEDED</text>
  <!-- monsters -->
  <text x="458" y="354" class="h3 center">3 FACE-UP MONSTERS</text>
  <g><rect x="285" y="368" width="105" height="145" rx="9" class="monster"/><text x="337" y="397" class="h3 center">MONSTER</text><text x="337" y="417" class="sm center">placeholder</text><rect x="300" y="468" width="75" height="25" rx="4" class="dark"/><text x="337" y="485" class="wtx center">SLAY ?</text></g>
  <g><rect x="407" y="368" width="105" height="145" rx="9" class="monster"/><text x="459" y="397" class="h3 center">MONSTER</text><text x="459" y="417" class="sm center">placeholder</text><rect x="422" y="468" width="75" height="25" rx="4" class="dark"/><text x="459" y="485" class="wtx center">SLAY ?</text></g>
  <g><rect x="529" y="368" width="105" height="145" rx="9" class="monster"/><text x="581" y="397" class="h3 center">MONSTER</text><text x="581" y="417" class="sm center">placeholder</text><rect x="544" y="468" width="75" height="25" rx="4" class="dark"/><text x="581" y="485" class="wtx center">SLAY ?</text></g>
  <!-- deck -->
  <rect x="110" y="405" width="75" height="105" rx="8" class="muted"/><text x="147" y="445" class="h3 center">DRAW</text><text x="147" y="463" class="sm center">deck</text><rect x="110" y="525" width="75" height="70" rx="8" class="muted"/><text x="147" y="554" class="h3 center">DISCARD</text><text x="147" y="572" class="sm center">pile</text>
  <!-- player party -->
  <rect x="232" y="544" width="365" height="70" rx="10" class="panel"/><text x="250" y="565" class="h3">YOUR PARTY</text><rect x="250" y="574" width="58" height="28" rx="5" class="good"/><text x="279" y="593" class="wtx center">LEADER</text><rect x="317" y="574" width="58" height="28" rx="5" class="card"/><rect x="384" y="574" width="58" height="28" rx="5" class="card"/><rect x="451" y="574" width="58" height="28" rx="5" class="card"/><text x="537" y="592" class="sm">Party 3 · Monsters 1/3</text>
  <!-- sidebar -->
  <rect x="850" y="205" width="230" height="429" rx="10" class="panel"/><text x="868" y="235" class="h2">CURRENT TURN</text><rect x="868" y="249" width="194" height="54" rx="7" class="good"/><text x="884" y="271" class="wtx">You · 2 / 3 AP</text><text x="884" y="289" class="wtx">Choose an action</text><text x="868" y="335" class="h3">CARD PREVIEW</text><rect x="868" y="346" width="94" height="135" rx="8" class="hand"/><text x="915" y="380" class="h3 center">CARD</text><text x="915" y="398" class="sm center">placeholder</text><text x="977" y="369" class="h3">Inspect</text><text x="977" y="389" class="sm">Tap/hover card for</text><text x="977" y="406" class="sm">rules &amp; targeting.</text><rect x="868" y="514" width="92" height="38" rx="7" class="accent"/><text x="914" y="538" class="wtx center">DRAW · 1 AP</text><rect x="970" y="514" width="92" height="38" rx="7" class="dark"/><text x="1016" y="538" class="wtx center">END TURN</text><text x="868" y="584" class="tiny">Challenge control appears only while a Hero, Item or Magic is played.</text><text x="868" y="601" class="tiny">Roll Hero effect: Modifier window only.</text>
  <!-- hand -->
  <rect x="80" y="650" width="1000" height="115" rx="14" class="dark"/><text x="100" y="675" class="wtx">YOUR HAND · 5</text>
  <g><rect x="205" y="665" width="92" height="83" rx="7" class="hand"/><rect x="308" y="665" width="92" height="83" rx="7" class="hand"/><rect x="411" y="665" width="92" height="83" rx="7" class="hand"/><rect x="514" y="665" width="92" height="83" rx="7" class="hand"/><rect x="617" y="665" width="92" height="83" rx="7" class="hand"/><text x="251" y="711" class="h3 center">CARD</text><text x="354" y="711" class="h3 center">CARD</text><text x="457" y="711" class="h3 center">CARD</text><text x="560" y="711" class="h3 center">CARD</text><text x="663" y="711" class="h3 center">CARD</text></g>
  <!-- reaction overlay -->
  <rect x="1145" y="135" width="395" height="650" rx="20" class="frame"/>
  <text x="1170" y="174" class="h2">REACTION OVERLAY · full-screen state</text>
  <rect x="1170" y="195" width="345" height="560" rx="12" fill="#27323b"/>
  <text x="1342" y="232" class="wtx center">MODIFIER WINDOW</text><text x="1342" y="256" class="sm center" fill="#fff">Shared deadline — does not reset</text>
  <circle cx="1342" cy="337" r="65" fill="#fffdf6" stroke="#e96943" stroke-width="8"/><text x="1342" y="331" class="h1 center">20</text><text x="1342" y="353" class="sm center">SECONDS</text>
  <rect x="1194" y="430" width="296" height="62" rx="8" fill="#fff"/><text x="1210" y="455" class="h3">TOTAL MODIFIER</text><text x="1468" y="462" class="h1 center">+ ?</text><text x="1210" y="478" class="sm">Shown before final roll resolves.</text>
  <text x="1194" y="530" class="wtx">ELIGIBLE PLAYERS</text><rect x="1194" y="543" width="94" height="38" rx="7" class="good"/><text x="1241" y="567" class="wtx center">YOU · SKIP</text><rect x="1295" y="543" width="94" height="38" rx="7" fill="#607078"/><text x="1342" y="567" class="wtx center">A · PLAYED</text><rect x="1396" y="543" width="94" height="38" rx="7" fill="#607078"/><text x="1443" y="567" class="wtx center">B · SKIPPED</text>
  <rect x="1194" y="610" width="296" height="48" rx="8" class="accent"/><text x="1342" y="640" class="wtx center">SKIP · CLOSES EARLY WHEN ALL ELIGIBLE SKIP</text>
  <rect x="1194" y="681" width="296" height="50" rx="8" fill="#fff"/><text x="1208" y="704" class="h3">CHALLENGE WINDOW</text><text x="1208" y="721" class="sm">Only Hero / Item / Magic play; never Hero-effect roll.</text>

  <!-- lower: lobby / mobile -->
  <text x="60" y="842" class="h2">ROOM / LOBBY · supporting state</text>
  <rect x="60" y="860" width="470" height="310" rx="18" class="frame"/>
  <text x="86" y="896" class="h2">JOIN A ROOM</text><text x="86" y="925" class="tx">Nickname</text><rect x="86" y="937" width="190" height="38" rx="6" class="panel"/><text x="98" y="961" class="sm">your display name</text><text x="300" y="925" class="tx">Room code</text><rect x="300" y="937" width="150" height="38" rx="6" class="panel"/><text x="312" y="961" class="sm">e.g. 8K4P</text><rect x="86" y="994" width="160" height="42" rx="7" class="accent"/><text x="166" y="1020" class="wtx center">CREATE / JOIN</text>
  <line x1="86" y1="1060" x2="505" y2="1060" class="dash"/><text x="86" y="1090" class="h3">BEFORE START · room host</text><text x="86" y="1112" class="tx">Reaction window default</text><rect x="288" y="1085" width="65" height="34" rx="6" class="panel"/><text x="320" y="1107" class="h3 center">20 s</text><text x="86" y="1142" class="tiny">Configurable before game only · Skip closes early when all eligible players skip.</text>
  <rect x="555" y="860" width="545" height="310" rx="18" class="frame"/><text x="580" y="896" class="h2">RECONNECT · non-blocking recovery state</text><rect x="580" y="922" width="495" height="88" rx="9" class="muted"/><text x="602" y="954" class="h3">Connection interrupted</text><text x="602" y="976" class="tx">Game state is being restored. Do not make game decisions locally.</text><rect x="602" y="1030" width="155" height="43" rx="7" class="dark"/><text x="679" y="1057" class="wtx center">RETRY CONNECTION</text><text x="602" y="1105" class="sm">On rejoin: show current actor, AP, deadline, reaction eligibility and latest resolved action.</text><text x="602" y="1130" class="tiny">Exact persistence/ordering behavior depends on Architecture protocol (UNKNOWN).</text>

  <!-- mobile -->
  <text x="60" y="1235" class="h2">MOBILE · structural reflow, not miniature desktop</text>
  <rect x="60" y="1255" width="420" height="410" rx="24" class="frame"/>
  <rect x="75" y="1270" width="390" height="35" class="dark"/><text x="91" y="1292" class="wtx">ROOM 8K4P</text><text x="373" y="1292" class="wtx">2 / 3 AP</text>
  <rect x="75" y="1318" width="390" height="50" rx="8" class="panel"/><text x="92" y="1340" class="h3">YOUR TURN · choose a card or action</text><text x="92" y="1357" class="sm">Opponent summaries: A · waiting  |  B · next  |  C · waiting</text>
  <text x="92" y="1401" class="h3">MONSTERS · swipe / inspect</text><rect x="92" y="1412" width="83" height="106" rx="7" class="monster"/><rect x="185" y="1412" width="83" height="106" rx="7" class="monster"/><rect x="278" y="1412" width="83" height="106" rx="7" class="monster"/><text x="133" y="1465" class="sm center">1</text><text x="226" y="1465" class="sm center">2</text><text x="319" y="1465" class="sm center">3</text>
  <rect x="92" y="1534" width="356" height="46" rx="8" class="panel"/><text x="107" y="1555" class="h3">YOUR PARTY / LEADER</text><text x="107" y="1572" class="sm">compact row · expand for card preview</text>
  <rect x="75" y="1593" width="390" height="58" rx="10" class="dark"/><text x="92" y="1614" class="wtx">HAND 5</text><rect x="163" y="1602" width="42" height="38" class="hand"/><rect x="211" y="1602" width="42" height="38" class="hand"/><rect x="259" y="1602" width="42" height="38" class="hand"/><rect x="307" y="1602" width="42" height="38" class="hand"/><rect x="355" y="1602" width="42" height="38" class="hand"/><rect x="403" y="1602" width="45" height="38" class="accent"/><text x="425" y="1626" class="wtx center">DRAW</text>
  <text x="520" y="1286" class="h2">Interaction notes</text><text x="520" y="1314" class="tx">• Tap a card → preview / valid target guidance.</text><text x="520" y="1338" class="tx">• Action state stays visible; no assumed effects.</text><text x="520" y="1362" class="tx">• Reaction overlay takes full viewport and retains timer.</text><text x="520" y="1386" class="tx">• Accessibility: visible labels, not color-only turn/Skip state.</text><text x="520" y="1420" class="sm">Approval needed: player-scale model, final copy/icons,</text><text x="520" y="1438" class="sm">and protocol-driven reconnect / timer presentation.</text>
</svg>
