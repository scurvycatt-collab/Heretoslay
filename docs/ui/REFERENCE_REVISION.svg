<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1480" viewBox="0 0 2480 1480" role="img" aria-labelledby="title desc">
<title id="title">Reference-informed tabletop and reaction mockups</title>
<desc id="desc">Four desktop review mockups: game table, hero roll modifier, challenge prompt and challenge versus. All cards and values are placeholders.</desc>
<style>.bg{fill:#101d2b}.board{fill:#f8f8f5;stroke:#060d17;stroke-width:12}.chrome{fill:#142336;stroke:#050a12;stroke-width:5}.panel{fill:#101722;stroke:#64748b;stroke-width:3}.card{fill:#19212c;stroke:#e9edf0;stroke-width:4}.monster{fill:#3b2530;stroke:#f0a85a;stroke-width:4}.ghost{fill:#eef0ed;stroke:#9ca3af;stroke-width:3}.txt{font-family:Consolas,monospace;fill:#eaf2f5;font-weight:700}.ink{font-family:Consolas,monospace;fill:#152231;font-weight:700}.small{font:15px Consolas,monospace}.mid{font:22px Consolas,monospace;font-weight:700}.big{font:32px Consolas,monospace;font-weight:700}.huge{font:72px Consolas,monospace;font-weight:700}.yellow{fill:#ffc21a}.green{fill:#36d27c}.red{fill:#ff6363}.blue{fill:#63a5ff}.muted{fill:#aab4c0}.cut{stroke:#ff9e28;stroke-width:3;fill:none}.dim{fill:#08101bcc}.label{font:13px Consolas,monospace;fill:#aab4c0;font-weight:700}.demo{font:12px Consolas,monospace;fill:#687585;font-weight:700}</style>
